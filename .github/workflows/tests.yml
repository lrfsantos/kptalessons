name: Automated tests

on:
  push:
    branches: [master, "poc/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Aplicativo Tauri + WebView2 (Windows apenas).
  tauri-app:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Package sidecar resources
        shell: powershell
        run: |
          $node = (node -p "process.execPath")
          ./scripts/poc-package-resources.ps1 -NodeExe $node
      - name: cargo fmt --check (Tauri)
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo check (Tauri)
        working-directory: src-tauri
        run: cargo check
      - name: Build installer (NSIS obrigatório)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: corretor-cna-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

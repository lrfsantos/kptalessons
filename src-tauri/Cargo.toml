[package]
name = "app"
version = "0.1.0"
description = "Corretor CNA — correção de atividades escritas do portal CNA com a IA escolhida pelo professor"
authors = ["Corretor CNA"]
license = "MIT"
repository = "https://github.com/lrfsantos/kptalessons"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-single-instance = "2"
getrandom = "0.3"
